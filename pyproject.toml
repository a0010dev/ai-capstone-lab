[project]
name = "industrial-reporting-agent"
version = "0.1.0"
description = "A read-only reporting agent for industrial company data with controlled access and deterministic calculations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "logfire>=5.4.0",
    "minsearch>=0.2.0",
    "pydantic-ai-slim[openai]>=2.66.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pydantic>=2.13.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: calls the real model API and may incur usage costs",
    "judge_calibration: real judge on fixed answers with human-assigned expected labels",
]
